name: MongoDB plugin

# Builds and tests only when the MongoDB plugin or something it is built with changes.
# Pushes run on master only: a branch with an open pull request is tested by the pull_request run,
# and a branch without one can be run by hand (workflow_dispatch)
on:
  push:
    branches:
      - master
    paths: &paths
      - "plugins/mongodb/**"
      - "shared/**"
      - "pom.xml"
      - "mvnw"
      - "mvnw.cmd"
      - ".mvn/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mongodb.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mongodb:
    name: MongoDB plugin
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags: the changelog is generated from this plugin's commits since each release tag
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: zulu

      # Not setup-java's `cache: maven`: its key is the poms' hash with no fallback, so every pom change downloaded the
      # whole repository from Maven Central again, which Central now answers with 429 Too Many Requests. A restore key
      # starts from the newest cache and downloads only what changed. Retries on 429 are in .mvn/maven.config
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # plugin.json, the backend pom.xml and the frontend package.json must name the same version
      - name: Check version
        run: node shared/scripts/plugin-version.mjs plugins/mongodb

      # Frontend typecheck and unit tests, then backend unit and Testcontainers tests (Docker is available on the Ubuntu runner)
      - name: Test
        run: npm run mongodb:test

      - name: Package and verify
        run: npm run mongodb:package

      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: com.queryeer.mongodb
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
